<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f5fd6" />
    <title>AGH Care · 网络未连接</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; color: #173b76; background: #f5f7fb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(100%, 380px); text-align: center; }
      img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 14px 30px rgba(31, 95, 214, .2); }
      h1 { margin: 24px 0 8px; font-size: 24px; letter-spacing: 0; }
      p { margin: 0; color: #67758b; font-size: 14px; line-height: 1.7; }
      button { width: 100%; margin-top: 26px; padding: 14px 18px; border: 0; border-radius: 7px; color: #fff; background: #1f5fd6; font: inherit; font-weight: 700; }
      small { display: block; margin-top: 18px; color: #909bad; font-size: 11px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="AGH Care" />
      <h1>暂时无法连接服务</h1>
      <p>请检查网络后重试。为保护医疗资料，离线状态下不会展示缓存的患者档案内容。</p>
      <button type="button" onclick="location.reload()">重新连接</button>
      <small>紧急情况请直接联系当地医院或急救服务</small>
    </main>
  </body>
</html>
